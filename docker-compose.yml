services:
  yc4free:
    build: .
    image: yc4free:local
    container_name: yc4free
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:-localhost}
      XRAY_PORT: ${XRAY_PORT:-443}
      WEB_PORT: ${WEB_PORT:-8080}
      CONFIG_PATH: ${CONFIG_PATH:-/client}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:-change-me}
      REALITY_DEST: ${REALITY_DEST:-www.microsoft.com:443}
      REALITY_SERVER_NAME: ${REALITY_SERVER_NAME:-www.microsoft.com}
      CLIENT_REMARK: ${CLIENT_REMARK:-YC4free}
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}/tcp"
      - "${XRAY_PORT:-443}:${XRAY_PORT:-443}/tcp"
    volumes:
      - ./runtime/data:/data
