      <h1>日常运维命令</h1>
      <p>YC4free 把常用操作放在 <code>scripts/</code> 目录中，避免每次手动输入复杂命令。</p>
      <pre><code>./scripts/status.sh
./scripts/logs.sh
./scripts/restart.sh
./scripts/show-client.sh
./scripts/uninstall.sh</code></pre>
      <p>卸载脚本只会停止容器，不会删除 <code>.env</code> 和 <code>runtime/</code> 中的本地配置，避免误删服务密钥。</p>
    </main>
